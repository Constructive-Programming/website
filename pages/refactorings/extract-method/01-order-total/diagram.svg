<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 244" role="img" aria-labelledby="d1-title" style="width:100%;height:auto;font-family:inherit;font-variant-ligatures:none;font-feature-settings:'calt' 0">
  <title id="d1-title">Extracting subtotal and percent from total. Before: total(o) computes the line sum, the discount and the tax inline; the line sum and the two "amount times pct over 100" expressions are marked as regions. After: total(o) calls subtotal(items) with o.items, and percent(pct, amount) twice, with (o.discountPct, net) and (o.taxPct, discounted).</title>
  <g fill="currentColor" font-size="12" opacity=".6">
    <text x="16" y="26">before</text>
    <text x="428" y="26">after</text>
  </g>
  <g fill="rgba(128,128,128,.07)" stroke="currentColor" stroke-width="1">
    <rect x="16" y="36" width="388" height="144" rx="4"/>
    <rect x="428" y="36" width="336" height="90" rx="4"/>
    <rect x="428" y="186" width="132" height="42" rx="4"/>
    <rect x="580" y="186" width="184" height="42" rx="4"/>
  </g>
  <g fill="rgba(128,128,128,.12)" stroke="currentColor" stroke-width="1" stroke-dasharray="4 3">
    <rect x="46" y="81" width="340" height="18" rx="3"/>
    <rect x="46" y="117" width="340" height="18" rx="3"/>
    <rect x="46" y="153" width="340" height="18" rx="3"/>
  </g>
  <g fill="currentColor" font-size="12">
    <text x="28" y="58">total(o) =</text>
    <text x="40" y="76">val subtotal =</text>
    <text x="52" y="94">o.items.map(l =&gt; l.unitPrice * l.quantity).sum</text>
    <text x="40" y="112">val discounted = subtotal -</text>
    <text x="52" y="130">subtotal * o.discountPct / 100</text>
    <text x="40" y="148">discounted +</text>
    <text x="52" y="166">discounted * o.taxPct / 100</text>
    <text x="440" y="58">total(o) =</text>
    <text x="452" y="76">val net = subtotal(o.items)</text>
    <text x="452" y="94">val discounted = net - percent(o.discountPct, net)</text>
    <text x="452" y="112">discounted + percent(o.taxPct, discounted)</text>
  </g>
  <g fill="currentColor" font-size="13" font-weight="600">
    <text x="440" y="212">subtotal(items)</text>
    <text x="592" y="212">percent(pct, amount)</text>
  </g>
  <g fill="none" stroke="currentColor" stroke-width="1">
    <circle cx="386" cy="81" r="7.5"/>
    <circle cx="386" cy="117" r="7.5"/>
    <circle cx="386" cy="153" r="7.5"/>
    <circle cx="428" cy="186" r="7.5"/>
    <circle cx="580" cy="186" r="7.5"/>
  </g>
  <g fill="currentColor" font-size="12" text-anchor="middle">
    <text x="386" y="85">1</text>
    <text x="386" y="121">2</text>
    <text x="386" y="157">2</text>
    <text x="428" y="190">1</text>
    <text x="580" y="190">2</text>
  </g>
  <g fill="none" stroke="currentColor" stroke-width="1.2">
    <path d="M494 126 V178"/>
    <path d="M672 126 V178"/>
  </g>
  <g fill="currentColor">
    <path d="M490.5 178 L494 186 L497.5 178 Z"/>
    <path d="M668.5 178 L672 186 L675.5 178 Z"/>
  </g>
  <g fill="currentColor" font-size="12" text-anchor="end">
    <text x="486" y="160">o.items</text>
    <text x="664" y="152">o.discountPct, net</text>
    <text x="664" y="170">o.taxPct, discounted</text>
  </g>
</svg>
