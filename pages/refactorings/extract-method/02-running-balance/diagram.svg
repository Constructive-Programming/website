<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 276" role="img" aria-labelledby="d2-title" style="width:100%;height:auto;font-family:inherit;font-variant-ligatures:none;font-feature-settings:'calt' 0">
  <title id="d2-title">Extracting step from settle. Before: settle folds the transactions with an inline lambda whose free variables are limit and fee. After: settle calls txs.foldLeft(opening)(step(limit, fee)); step(limit, fee)(balance, tx) is the lambda body, with limit and fee as leading parameters and balance and tx supplied by the fold.</title>
  <g fill="currentColor" font-size="12" opacity=".6">
    <text x="16" y="26">before</text>
    <text x="428" y="26">after</text>
  </g>
  <g fill="rgba(128,128,128,.07)" stroke="currentColor" stroke-width="1">
    <rect x="16" y="36" width="388" height="170" rx="4"/>
    <rect x="428" y="36" width="336" height="54" rx="4"/>
    <rect x="428" y="170" width="336" height="90" rx="4"/>
  </g>
  <rect x="46" y="81" width="340" height="72" rx="3" fill="rgba(128,128,128,.12)" stroke="currentColor" stroke-width="1" stroke-dasharray="4 3"/>
  <g fill="currentColor" font-size="12">
    <text x="28" y="58">settle(opening, limit, fee, txs) =</text>
    <text x="40" y="76">txs.foldLeft(opening) {</text>
    <text x="52" y="94">(balance, tx) =&gt;</text>
    <text x="64" y="112">val next = balance + tx</text>
    <text x="64" y="130">if tx &lt; 0 &amp;&amp; next &lt; -limit</text>
    <text x="64" y="148">then next - fee else next</text>
    <text x="40" y="166">}</text>
    <text x="28" y="192" opacity=".75">free in the lambda: limit, fee</text>
    <text x="440" y="58">settle(opening, limit, fee, txs) =</text>
    <text x="452" y="76">txs.foldLeft(opening)(step(limit, fee))</text>
    <text x="440" y="192" font-size="13" font-weight="600">step(limit, fee)(balance, tx) =</text>
    <text x="452" y="210">val next = balance + tx</text>
    <text x="452" y="228">if tx &lt; 0 &amp;&amp; next &lt; -limit</text>
    <text x="452" y="246">then next - fee else next</text>
  </g>
  <g fill="none" stroke="currentColor" stroke-width="1">
    <circle cx="386" cy="81" r="7.5"/>
    <circle cx="428" cy="170" r="7.5"/>
  </g>
  <g fill="currentColor" font-size="12" text-anchor="middle">
    <text x="386" y="85">1</text>
    <text x="428" y="174">1</text>
  </g>
  <path d="M460 90 V162" fill="none" stroke="currentColor" stroke-width="1.2"/>
  <path d="M456.5 162 L460 170 L463.5 162 Z" fill="currentColor"/>
  <g fill="currentColor" font-size="12">
    <text x="472" y="112">limit, fee <tspan opacity=".7">— free in the lambda,</tspan></text>
    <text x="472" y="128" opacity=".7">now the leading parameters</text>
    <text x="472" y="152">balance, tx <tspan opacity=".7">— supplied by foldLeft</tspan></text>
  </g>
</svg>
