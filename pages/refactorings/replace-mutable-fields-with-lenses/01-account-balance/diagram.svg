<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 196" role="img" aria-labelledby="d1-title" style="width:100%;height:auto;font-family:inherit;font-variant-ligatures:none;font-feature-settings:'calt' 0">
  <title id="d1-title">Replacing the balance field with a lens in the withdraw program. Before: withdraw(Account(balance, bonus), amount) reads balance with a.balance and writes it with a.copy(balance = a.balance - amount); the dotted region is the field access and copy spell-out. After: withdraw is balance.modify(_ - amount)(a), where balanceLens = Lens(get = _.balance, set = b => a => a.copy(balance = b)).</title>
  <g fill="currentColor" font-size="12" opacity=".6">
    <text x="16" y="26">before</text>
    <text x="428" y="26">after</text>
  </g>
  <g fill="rgba(128,128,128,.07)" stroke="currentColor" stroke-width="1">
    <rect x="16" y="36" width="388" height="148" rx="4"/>
    <rect x="428" y="36" width="336" height="92" rx="4"/>
    <rect x="428" y="150" width="336" height="34" rx="4"/>
  </g>
  <g fill="rgba(128,128,128,.12)" stroke="currentColor" stroke-width="1" stroke-dasharray="4 3">
    <rect x="44" y="84" width="336" height="66" rx="3"/>
  </g>
  <g fill="currentColor" font-size="12">
    <text x="28" y="58">withdraw(a: Account, amount) =</text>
    <text x="40" y="76">a.copy(balance = a.balance - amount)</text>
    <text x="52" y="98">read: a.balance</text>
    <text x="52" y="116">write: a.copy(balance = ...)</text>
    <text x="52" y="134">every call site spells out the</text>
    <text x="52" y="148">field update by hand</text>
    <text x="440" y="58">withdraw(a, amount) =</text>
    <text x="452" y="76">balanceLens.modify(_ - amount)(a)</text>
    <text x="440" y="100">balanceLens =</text>
    <text x="452" y="120">Lens(get = _.balance,</text>
    <text x="452" y="136">     set = ...)</text>
  </g>
  <g fill="currentColor" font-size="12" text-anchor="middle" opacity=".85">
    <text x="212" y="168">field access + copy spell-out</text>
    <text x="596" y="172">get and set packed as one value</text>
  </g>
  <g fill="none" stroke="currentColor" stroke-width="1">
    <circle cx="386" cy="112" r="7.5"/>
    <circle cx="428" cy="156" r="7.5"/>
  </g>
  <g fill="currentColor" font-size="12" text-anchor="middle">
    <text x="386" y="116">1</text>
    <text x="428" y="160">1</text>
  </g>
  <g fill="none" stroke="currentColor" stroke-width="1.2">
    <path d="M386 132 V144"/>
  </g>
  <g fill="currentColor">
    <path d="M382.5 144 L386 152 L389.5 144 Z"/>
  </g>
</svg>
