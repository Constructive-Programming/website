<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 192" role="img" aria-labelledby="d2-title" style="width:100%;height:auto;font-family:inherit;font-variant-ligatures:none">
  <title id="d2-title">Before, renameAll owns both the recursive walk and the name edit. After, a Plated instance defines which fields recurse, Plated.everywhere supplies the walk, and varName supplies the edit.</title>
  <defs>
    <marker id="d2-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="currentColor"/>
    </marker>
  </defs>
  <g fill="currentColor" font-size="12" opacity=".65">
    <text x="16" y="22">before</text>
    <text x="464" y="22">after</text>
  </g>
  <g fill="rgba(128,128,128,.07)" stroke="currentColor" stroke-width="1">
    <rect x="16" y="30" width="300" height="146" rx="4"/>
    <rect x="464" y="30" width="300" height="146" rx="4"/>
  </g>
  <g fill="rgba(128,128,128,.12)">
    <rect x="30" y="58" width="272" height="64" rx="3"/>
    <rect x="478" y="58" width="272" height="64" rx="3"/>
  </g>
  <g fill="currentColor" font-size="12">
    <text x="28" y="50">renameAll(e) = e match</text>
    <text x="40" y="76">EVar(v) → edit name</text>
    <text x="40" y="94">EApp(a,b) → recurse a, recurse b</text>
    <text x="40" y="112">ELam(_,b) → recurse b</text>
    <text x="28" y="144">one method owns walk + edit</text>
    <text x="28" y="162">nesting obscures the business rule</text>
    <text x="476" y="50">given Plated[Expr]: descend only</text>
    <text x="488" y="76">Plated.everywhere supplies the walk</text>
    <text x="488" y="94">varName supplies the focus</text>
    <text x="488" y="112">upper supplies the edit</text>
    <text x="476" y="144">three independent, reusable parts</text>
    <text x="476" y="162">the example declares only recursion</text>
  </g>
  <path d="M332 102 H448" fill="none" stroke="currentColor" stroke-width="1.2" marker-end="url(#d2-arrow)"/>
  <text x="390" y="90" fill="currentColor" font-size="12" text-anchor="middle">separate walk and edit</text>
</svg>
