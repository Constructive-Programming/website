<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 176" role="img" aria-labelledby="d3-title" style="width:100%;height:auto;font-family:inherit;font-variant-ligatures:none">
  <title id="d3-title">Before, bumpSucceeded combines the list walk, branch selection and value edit in one match. After, each, succeededP and valueL compose, then over adds one.</title>
  <defs>
    <marker id="d3-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="currentColor"/>
    </marker>
  </defs>
  <g fill="currentColor" font-size="12" opacity=".65">
    <text x="16" y="22">before</text>
    <text x="464" y="22">after</text>
  </g>
  <g fill="rgba(128,128,128,.07)" stroke="currentColor" stroke-width="1">
    <rect x="16" y="30" width="300" height="126" rx="4"/>
    <rect x="464" y="30" width="300" height="126" rx="4"/>
  </g>
  <g fill="rgba(128,128,128,.12)">
    <rect x="30" y="58" width="272" height="42" rx="3"/>
    <rect x="478" y="58" width="272" height="42" rx="3"/>
  </g>
  <g fill="currentColor" font-size="12">
    <text x="28" y="50">xs.map { result → result match</text>
    <text x="40" y="76">Succeeded(ok) → bump ok.value</text>
    <text x="40" y="94">Failed(msg) → keep unchanged</text>
    <text x="28" y="122">walk + branch + field edit</text>
    <text x="28" y="140">are one nested operation</text>
    <text x="476" y="50">succeededP.andThen(valueL).each</text>
    <text x="488" y="76">each: every list element</text>
    <text x="488" y="94">prism: success · lens: value</text>
    <text x="476" y="122">over(eachSucceeded, _ + 1)</text>
    <text x="476" y="140">failed values pass through</text>
  </g>
  <path d="M332 92 H448" fill="none" stroke="currentColor" stroke-width="1.2" marker-end="url(#d3-arrow)"/>
  <text x="390" y="80" fill="currentColor" font-size="12" text-anchor="middle">compose three steps</text>
</svg>
