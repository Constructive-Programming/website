<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 174" role="img" aria-labelledby="koan-title" style="width:100%;height:auto;font-family:inherit;font-variant-ligatures:none">
  <title id="koan-title">One equation read in two directions. Before, navigation to a field and the edit are repeated together. After, the path is a composed optic and the edit is a separate function. Replace packages the path; inline writes the access directly.</title>
  <defs>
    <marker id="koan-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="currentColor"/>
    </marker>
  </defs>
  <g fill="currentColor" font-size="12" opacity=".65">
    <text x="16" y="22">before</text>
    <text x="434" y="22">after</text>
  </g>
  <g fill="rgba(128,128,128,.07)" stroke="currentColor" stroke-width="1">
    <rect x="16" y="30" width="190" height="120" rx="4"/>
    <rect x="434" y="30" width="190" height="120" rx="4"/>
  </g>
  <g fill="currentColor" font-size="12">
    <text x="28" y="56">reach the field</text>
    <text x="28" y="76">match / copy / recurse</text>
    <text x="28" y="104">then change it</text>
    <text x="28" y="124">business rule mixed</text>
    <text x="28" y="140">with navigation</text>
    <text x="446" y="56">path = prism</text>
    <text x="458" y="76">.andThen(lens).each</text>
    <text x="446" y="104">over(path, change)</text>
    <text x="446" y="124">navigation and rule</text>
    <text x="446" y="140">are separate values</text>
  </g>
  <path d="M224 72 H416" fill="none" stroke="currentColor" stroke-width="1.2" marker-end="url(#koan-arrow)"/>
  <text x="320" y="58" fill="currentColor" font-size="12" text-anchor="middle">replace: package the path</text>
  <path d="M416 116 H224" fill="none" stroke="currentColor" stroke-width="1.2" marker-end="url(#koan-arrow)"/>
  <text x="320" y="138" fill="currentColor" font-size="12" text-anchor="middle">inline: write the access directly</text>
</svg>
