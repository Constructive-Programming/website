<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 200" role="img" aria-labelledby="d3-title" style="width:100%;height:auto;font-family:inherit;font-variant-ligatures:none;font-feature-settings:'calt' 0">
  <title id="d3-title">Replacing a direct field write with a lens inside a recursive traversal. Before: bumpSizes(n, by) writes n.copy(size = n.size + by) then recurses over children. After: bumpSizes uses sizeLens.modify(_ + by)(n) to write the size and recurses over children unchanged; the recursion and the write are two independent steps and the write goes through the lens.</title>
  <g fill="currentColor" font-size="12" opacity=".6">
    <text x="16" y="26">before</text>
    <text x="428" y="26">after</text>
  </g>
  <g fill="rgba(128,128,128,.07)" stroke="currentColor" stroke-width="1">
    <rect x="16" y="36" width="388" height="128" rx="4"/>
    <rect x="428" y="36" width="336" height="128" rx="4"/>
  </g>
  <g fill="rgba(128,128,128,.12)" stroke="currentColor" stroke-width="1" stroke-dasharray="4 3">
    <rect x="44" y="76" width="332" height="34" rx="3"/>
  </g>
  <g fill="currentColor" font-size="12">
    <text x="28" y="58">bumpSizes(n: Node, by) =</text>
    <text x="40" y="76">n.copy(</text>
    <text x="52" y="94">size = n.size + by,</text>
    <text x="52" y="112">children = children.map(bumpSizes(_, by)))</text>
    <text x="52" y="140">field write spelled out</text>
    <text x="440" y="58">bumpSizes(n: Node, by) =</text>
    <text x="452" y="76">sizeLens.modify(_ + by)(</text>
    <text x="464" y="94">n.copy(children = children.map(bumpSizes(_, by))))</text>
    <text x="452" y="140">write through the lens,</text>
    <text x="452" y="158">recursion unchanged</text>
  </g>
  <g fill="none" stroke="currentColor" stroke-width="1">
    <circle cx="386" cy="118" r="7.5"/>
    <circle cx="428" cy="118" r="7.5"/>
  </g>
  <g fill="currentColor" font-size="12" text-anchor="middle">
    <text x="386" y="122">1</text>
    <text x="428" y="122">1</text>
  </g>
  <g fill="none" stroke="currentColor" stroke-width="1.2">
    <path d="M406 118 H414"/>
  </g>
  <g fill="currentColor">
    <path d="M414 114.5 L422 118 L414 121.5 Z"/>
  </g>
</svg>
