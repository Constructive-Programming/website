<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 200" role="img" aria-labelledby="d2-title" style="width:100%;height:auto;font-family:inherit;font-variant-ligatures:none;font-feature-settings:'calt' 0">
  <title id="d2-title">Replacing nested copy-updates with a composed lens path. Before: moveX(g, dx) writes g.copy(player = g.player.copy(x = g.player.x + dx)) — the copy chain touches level, player and x. After: playerX = compose player x is one lens, and moveX(g, dx) = playerX.modify(_ + dx)(g); playerX reads g.player.x and writes the nested record in one step.</title>
  <g fill="currentColor" font-size="12" opacity=".6">
    <text x="16" y="26">before</text>
    <text x="428" y="26">after</text>
  </g>
  <g fill="rgba(128,128,128,.07)" stroke="currentColor" stroke-width="1">
    <rect x="16" y="36" width="388" height="128" rx="4"/>
    <rect x="428" y="36" width="336" height="128" rx="4"/>
  </g>
  <g fill="rgba(128,128,128,.12)" stroke="currentColor" stroke-width="1" stroke-dasharray="4 3">
    <rect x="44" y="66" width="332" height="58" rx="3"/>
  </g>
  <g fill="currentColor" font-size="12">
    <text x="28" y="58">moveX(g, dx) =</text>
    <text x="40" y="76">g.copy(player =</text>
    <text x="52" y="94">g.player.copy(x = g.player.x + dx))</text>
    <text x="52" y="118">copy chain: level</text>
    <text x="52" y="134">then player then x</text>
    <text x="440" y="58">playerX = compose player x</text>
    <text x="452" y="76">moveX(g, dx) =</text>
    <text x="464" y="94">playerX.modify(_ + dx)(g)</text>
    <text x="452" y="118">one lens reach:</text>
    <text x="452" y="134">reads g.player.x,</text>
    <text x="452" y="150">writes the whole path</text>
  </g>
  <g fill="none" stroke="currentColor" stroke-width="1">
    <circle cx="386" cy="94" r="7.5"/>
    <circle cx="428" cy="94" r="7.5"/>
  </g>
  <g fill="currentColor" font-size="12" text-anchor="middle">
    <text x="386" y="98">1</text>
    <text x="428" y="98">1</text>
  </g>
  <g fill="none" stroke="currentColor" stroke-width="1.2">
    <path d="M406 94 H414"/>
  </g>
  <g fill="currentColor">
    <path d="M414 90.5 L422 94 L414 97.5 Z"/>
  </g>
</svg>
