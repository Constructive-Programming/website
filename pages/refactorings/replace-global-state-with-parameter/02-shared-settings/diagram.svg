<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 196" role="img" aria-labelledby="d2-title" style="width:100%;height:auto;font-family:inherit;font-variant-ligatures:none">
  <title id="d2-title">Before, applyTx(balance, tx) reaches aside for the global policy record. After, applyTx(policy, balance, tx) takes the record as one leading parameter, and settle fixes it by partial application at the fold.</title>
  <defs>
    <marker id="d2-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="currentColor"/>
    </marker>
  </defs>
  <g fill="currentColor" font-size="12" opacity=".65">
    <text x="16" y="22">before</text>
    <text x="464" y="22">after</text>
  </g>
  <g fill="rgba(128,128,128,.07)" stroke="currentColor" stroke-width="1">
    <rect x="16" y="30" width="300" height="146" rx="4"/>
    <rect x="464" y="30" width="300" height="146" rx="4"/>
  </g>
  <g fill="rgba(128,128,128,.12)">
    <rect x="30" y="62" width="272" height="60" rx="3"/>
    <rect x="478" y="62" width="272" height="60" rx="3"/>
  </g>
  <g fill="currentColor" font-size="12">
    <text x="28" y="50">policy = Policy(limit = 30, fee = 2)</text>
    <text x="40" y="80">applyTx(balance, tx) =</text>
    <text x="52" y="98">next = balance + tx</text>
    <text x="52" y="116">if next &lt; -policy.limit …</text>
    <text x="28" y="146">the step reaches aside for the record</text>
    <text x="488" y="80">applyTx(policy, balance, tx) =</text>
    <text x="500" y="98">next = balance + tx</text>
    <text x="500" y="116">if next &lt; -policy.limit …</text>
    <text x="476" y="146">settle = foldl′ (applyTx policy) 0</text>
    <text x="476" y="164">partial application at the fold</text>
  </g>
  <path d="M332 98 H448" fill="none" stroke="currentColor" stroke-width="1.2" marker-end="url(#d2-arrow)"/>
  <text x="390" y="66" fill="currentColor" font-size="12" text-anchor="middle">the whole record</text>
  <text x="390" y="82" fill="currentColor" font-size="12" text-anchor="middle">becomes one parameter</text>
</svg>
