# Libraries listed on the home page and /libraries/ page.

- slug: eo
  name: "cats-eo"
  featured: true
  tagline: "Existential optics for Scala 3, built on cats."
  description: >
    One Optic[S, T, A, B, F] trait unifies Lens, Prism, Optional,
    Traversal, Grate, AlgLens and Kaleidoscope. Discipline-checked
    laws, scoverage-driven quality, JMH benchmarks against Monocle,
    and circe + avro integrations with an observable-by-default Ior
    failure surface.
  stack: "Scala 3 + cats"
  status: "Active — v0.1.0 (2026)"
  repo: "https://github.com/Constructive-Programming/eo"
  docs: "https://eo.constructive.dev/"

- slug: surreals
  name: "surreals"
  tagline: "Conway's surreal numbers as a cats-algebra Field."
  description: >
    A small Scala 3 exploration of surreal numbers, encoded with
    droste recursion schemes (Fix[SurrealStructure]) and memoised
    with scaffeine. Discipline laws under test.
  stack: "Scala 3 + cats algebra + droste"
  status: "Experimental"
  repo: "https://github.com/Constructive-Programming/surreals"

- slug: rivoli
  name: "rivoli"
  featured: true
  # Research artefact, not a library — shown on the home page only.
  home_only: true
  tagline: "A 744B mixture-of-experts decode engine on one 128 GB APU."
  description: >
    Rust + tokio streaming inference for GLM-5.2 (744B int4, 78 layers,
    256 experts) on a single AMD Strix Halo APU, with hand-written
    HIP/ROCm kernels. Every milestone is gated on a measured number,
    not a vibe: 1.31 tok/s sustained over 512 tokens at 90.9% expert-cache
    hit, 0% run-to-run variance. The design law is to win by removing
    bottlenecks — the decode proved dispatch-bound, not bandwidth-bound.
  stack: "Rust + tokio + HIP/ROCm (gfx1151)"
  status: "Active — ≥1 tok/s goal met (2026)"
  repo: "https://github.com/Constructive-Programming/rivoli"

- slug: cardinality
  name: "scala-cardinality"
  featured: true
  tagline: "Counting type inhabitants — keep your types small."
  description: >
    A type-cardinality calculator for Scala ADTs (|T| over +, *, ^)
    that reads compiled TASTy via tasty-query. The sbt-cardinality
    plugin puts a number on every definition inside your build, so a
    CI diff shows whether each change shrank the state space or grew it.
  stack: "Scala + sbt + tasty-query"
  status: "Active — sbt-cardinality 0.0.6 (2026)"
  repo: "https://github.com/Constructive-Programming/scala-cardinality"
  docs: "https://cardinality.constructive.dev/"
