# Spellr configuration (https://github.com/robotdana/spellr), the Ruby/bundler
# spell checker. Checked files obey .gitignore; these excludes are for
# Jekyll/generated trees that git ignores anyway, kept explicit so `spellr`
# behaves identically from any directory.
excludes:
  - .git/
  - _site/
  - .jekyll-cache/
  - vendor/
  - node_modules/
  - .venv/
  - Gemfile.lock

# Site-specific spelling lives in .spellr_wordlists/english.txt; regenerate
# or extend it with `bundle exec spellr --wordlist`.
languages:
  english:
    locale: US
